<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Birthday | Shiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --p-1: #ff0055;
            --p-2: #00f2ff;
            --p-3: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            font-family: 'Outfit', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- MAGIC BACKGROUND ELEMENTS --- */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            z-index: 0;
            opacity: 0.5;
            animation: moveStars 100s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        /* --- REALISTIC CSS BALLOONS --- */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            bottom: -200px;
            width: 100px;
            height: 125px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 15s linear infinite;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        .balloon::before { 
            content: "";
            position: absolute;
            width: 2px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            top: 125px;
            left: 50%;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); left: var(--start-x); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); left: var(--end-x); opacity: 0; }
        }

        /* --- THE GLASS CONTAINER --- */
        .card {
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 4rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
            max-width: 90%;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* --- TYPOGRAPHY MAGIC --- */
        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem;
            margin: 0;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .swapna-title {
            font-size: clamp(4rem, 12vw, 9rem);
            display: block;
            margin: -10px 0 20px 0;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--p-1), var(--p-2), var(--p-3), var(--p-1));
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 10px 20px rgba(255, 0, 85, 0.3));
        }

        @keyframes shine {
            to { background-position: 300% center; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
            to { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff0055; }
        }

        /* --- AUTOMATED STATUS BADGE --- */
        .status-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        @media (max-width: 600px) {
            .card { padding: 2rem; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="balloon-container" id="balloons"></div>

    <div class="card" id="tiltCard">
        <h1>Happy Birthday</h1>
        <span class="swapna-title">SIVA</span>
        <div class="status-badge">✨ Magic in Progress ✨</div>
    </div>

    <script>
        function createBalloons() {
            const container = document.getElementById('balloons');
            const colors = ['#ff0055', '#00f2ff', '#ffd700', '#7000ff', '#ff8800'];
            for(let i = 0; i < 15; i++) {
                let b = document.createElement('div');
                b.className = 'balloon';
                b.style.setProperty('--start-x', Math.random() * 100 + '%');
                b.style.setProperty('--end-x', (Math.random() * 100 - 20) + '%');
                b.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                b.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(b);
            }
        }

        function magicSplash() {
            const count = 150;
            const defaults = { origin: { y: 0.7 }, zIndex: 1000 };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff0055', '#ffffff'] });
            fire(0.2, { spread: 60, colors: ['#00f2ff'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45, colors: ['#ffd700'] });

            // Visual impact on card
            const card = document.getElementById('tiltCard');
            card.style.transform = "scale(1.05)";
            setTimeout(() => card.style.transform = "scale(1)", 200);
        }

        // Mouse Tilt Logic
        const card = document.getElementById('tiltCard');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        window.onload = () => {
            createBalloons();
            
            // 1. Initial burst
            confetti({ particleCount: 150, spread: 70, origin: { x: 0, y: 0.8 } });
            confetti({ particleCount: 150, spread: 70, origin: { x: 1, y: 0.8 } });

            // 2. Automate the "Big Splash" after 1 second
            setTimeout(magicSplash, 1000);

            // 3. Keep the magic going every 4 seconds
            setInterval(() => {
                magicSplash();
            }, 4000);
        };
    </script>
</body>

</html>
